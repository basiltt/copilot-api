name: Deploy to Server

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      preflight_only:
        description: Read-only production preflight without deployment or restarts
        type: boolean
        default: false
      activate_reviewed_release:
        description: Activate reviewed 09f3caf over baseline 2635315 with native Agent constraints
        type: boolean
        default: false

jobs:
  deploy:
    if: github.event_name != 'workflow_dispatch' || (!inputs.preflight_only && !inputs.activate_reviewed_release)
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -euo pipefail
            export PATH=/root/.bun/bin:$PATH
            cd /root/projects/copilot-api

            # Hard-reset to the pushed commit rather than merging.
            #
            # `git pull` aborts when an untracked file on the server collides
            # with one arriving in the commit — which is exactly what happened
            # when deploy/token-watchdog.sh and deploy/copilot-api-watchdog.service
            # were created by hand on the box and later committed to the repo.
            # Because the old script ignored the failure, every subsequent run
            # rebuilt and restarted the *previous* code while still reporting
            # success, so the server silently sat on a stale commit.
            #
            # `set -e` above now makes any step failing abort the deploy, and
            # fetch + reset --hard is immune to untracked-file collisions.
            git fetch origin master
            git reset --hard origin/master
            # Drop leftover untracked files so the tree matches the commit
            # exactly, but keep node_modules/dist to avoid a cold rebuild.
            git clean -fd -e node_modules -e dist

            echo "Deploying $(git rev-parse --short HEAD)"

            bun install
            bun run build
            systemctl restart copilot-api
            sleep 3
            systemctl is-active copilot-api
            systemctl restart copilot-api-watchdog
            systemctl is-active copilot-api-watchdog

  preflight:
    if: github.event_name == 'workflow_dispatch' && (inputs.preflight_only || inputs.activate_reviewed_release)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Read pinned-release state over verified SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$SERVER_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$SERVER_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          test -n "$SSHPASS"
          if ! command -v sshpass >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
          umask 077
          known_hosts="$RUNNER_TEMP/copilot-api-known-hosts"
          trap 'rm -f -- "$known_hosts"' EXIT
          ssh-keyscan -T 15 -t ed25519 "$SERVER_HOST" > "$known_hosts"
          fingerprint="$(ssh-keygen -l -E sha256 -f "$known_hosts" | awk '{print $2}')"
          test "$fingerprint" = "SHA256:B3uhmfjUir68hcntc1qDf1JOYTwVUALkD4+7c15VHCo"
          sshpass -e ssh -T \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" \
            -o ConnectTimeout=15 \
            -o PreferredAuthentications=password \
            -o NumberOfPasswordPrompts=1 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            "$SERVER_USER@$SERVER_HOST" 'python3 -' <<'PY'
          import datetime
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess

          if os.geteuid() != 0:
              raise RuntimeError("Production preflight requires the configured root identity")

          def command(*args):
              return subprocess.check_output(args, text=True).strip()

          def digest(path):
              return hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()

          units = {}
          for name in ("copilot-api", "copilot-api-watchdog", "nginx"):
              properties = command(
                  "systemctl", "show", name, "--no-pager",
                  "--property=ActiveState,SubState,MainPID,NRestarts",
              )
              unit = dict(line.split("=", 1) for line in properties.splitlines())
              unit["MainPID"] = int(unit["MainPID"])
              unit["NRestarts"] = int(unit["NRestarts"])
              if unit["ActiveState"] != "active" or unit["MainPID"] <= 0:
                  raise RuntimeError(f"{name} is not active")
              if name != "nginx":
                  cwd = pathlib.Path(f"/proc/{unit['MainPID']}/cwd").resolve(strict=True)
                  arguments = pathlib.Path(
                      f"/proc/{unit['MainPID']}/cmdline"
                  ).read_bytes().decode().replace("\0", " ")
                  pattern = r"/root/projects/copilot-api-releases/([0-9a-f]{40})(?:/|\b)"
                  releases = set(re.findall(pattern, str(cwd) + "\n" + arguments))
                  if len(releases) != 1:
                      raise RuntimeError(f"{name} has no unique running release identity")
                  release = releases.pop()
                  expected = pathlib.Path("/root/projects/copilot-api-releases") / release
                  if command("git", "-C", str(expected), "rev-parse", "HEAD") != release:
                      raise RuntimeError(f"{name} release directory does not match its commit")
                  configured = command(
                      "systemctl", "show", name, "--no-pager",
                      "--property=ExecStart,WorkingDirectory",
                  )
                  pin = pathlib.Path(
                      f"/etc/systemd/system/{name}.service.d/90-reviewed-release.conf"
                  ).read_text()
                  unit["release"] = release
                  unit["cwd_matches_release"] = cwd == expected
                  unit["configured_release_matches"] = set(re.findall(pattern, configured)) == {release}
                  unit["pin_matches_release"] = set(re.findall(pattern, pin)) == {release}
                  unit["tree"] = command("git", "-C", str(expected), "rev-parse", "HEAD^{tree}")
                  unit["clean"] = not command("git", "-C", str(expected), "status", "--porcelain")
              units[name] = unit

          environment_file = pathlib.Path("/root/projects/copilot-api/.env")
          metadata = environment_file.stat()
          process_environment = dict(
              entry.split(b"=", 1)
              for entry in pathlib.Path(
                  f"/proc/{units['copilot-api']['MainPID']}/environ"
              ).read_bytes().split(b"\0")
              if b"=" in entry
          )
          flags = {
              "WEB_SEARCH_PROVIDER": "copilot",
              "STRUCTURED_OUTPUT_RECOVERY": "1",
              "WRITE_TOOL_RECOVERY": "1",
              "TOOL_SEARCH_RECOVERY": "1",
              "COPILOT_NATIVE_MESSAGES": "1",
          }
          for name, expected in flags.items():
              if process_environment.get(name.encode()) != expected.encode():
                  raise RuntimeError(f"Required production flag is missing or different: {name}")
          agent_constraints = process_environment.get(b"AGENT_SCHEMA_CONSTRAINTS")
          if agent_constraints not in (None, b"0", b"1"):
              raise RuntimeError("The Agent constraints process setting is invalid")
          flags["AGENT_SCHEMA_CONSTRAINTS"] = (
              agent_constraints.decode() if agent_constraints is not None else None
          )
          result = {
              "checked_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "units": units,
              "environment": {
                  "sha256": digest(environment_file),
                  "uid": metadata.st_uid,
                  "gid": metadata.st_gid,
                  "mode": oct(metadata.st_mode & 0o777),
                  "flags": flags,
              },
              "pin_sha256": {
                  name: digest(
                      f"/etc/systemd/system/{name}.service.d/90-reviewed-release.conf"
                  )
                  for name in ("copilot-api", "copilot-api-watchdog")
              },
              "bun_version": command("/root/.bun/bin/bun", "--version"),
          }
          print(json.dumps(result, sort_keys=True))
          PY

  reviewed_release:
    if: github.event_name == 'workflow_dispatch' && inputs.activate_reviewed_release && !inputs.preflight_only
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: copilot-api-reviewed-release
      cancel-in-progress: false
    steps:
      - name: Check out deployment controls
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Transfer and activate the verified isolated release
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          APPLICATION_SHA: 09f3caf795a7e8e9c5350cf2cfef319e3244ef61
          APPLICATION_TREE: 8137d98b9f2dd0586bd78eff3326d18063de4633
          EXPECTED_LIVE_SHA: 2635315afb5f0ee526e2b9fe0f0bcdd6c8b20699
        run: |
          set -euo pipefail
          [[ "$SERVER_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$SERVER_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          test -n "$SSHPASS"
          test "$(git rev-parse "$APPLICATION_SHA^{tree}")" = "$APPLICATION_TREE"
          git merge-base --is-ancestor "$EXPECTED_LIVE_SHA" "$APPLICATION_SHA"
          git merge-base --is-ancestor "$APPLICATION_SHA" HEAD
          git update-ref refs/heads/task-reviewed-release "$APPLICATION_SHA"
          git bundle create "$RUNNER_TEMP/release.bundle" refs/heads/task-reviewed-release
          git bundle verify "$RUNNER_TEMP/release.bundle"
          bundle_hash="$(sha256sum "$RUNNER_TEMP/release.bundle" | cut -d ' ' -f 1)"
          if ! command -v sshpass >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
          umask 077
          known_hosts="$RUNNER_TEMP/copilot-api-known-hosts"
          trap 'rm -f -- "$known_hosts" "$RUNNER_TEMP/release.bundle"' EXIT
          ssh-keyscan -T 15 -t ed25519 "$SERVER_HOST" > "$known_hosts"
          fingerprint="$(ssh-keygen -l -E sha256 -f "$known_hosts" | awk '{print $2}')"
          test "$fingerprint" = "SHA256:B3uhmfjUir68hcntc1qDf1JOYTwVUALkD4+7c15VHCo"
          options=(
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts"
            -o ConnectTimeout=15
            -o PreferredAuthentications=password
            -o NumberOfPasswordPrompts=1
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=2
          )
          remote="$SERVER_USER@$SERVER_HOST"
          stage="/root/projects/copilot-api-release-staging/run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          sshpass -e ssh -T "${options[@]}" "$remote" \
            "umask 077; test ! -e '$stage' && mkdir -p -m 700 '$stage'"
          sshpass -e scp "${options[@]}" \
            "$RUNNER_TEMP/release.bundle" deploy/activate-reviewed-release.sh "$remote:$stage/"
          sshpass -e ssh -T "${options[@]}" "$remote" \
            "bash '$stage/activate-reviewed-release.sh' '$APPLICATION_SHA' '$EXPECTED_LIVE_SHA' '$bundle_hash' '$APPLICATION_TREE'"
          sshpass -e ssh -T "${options[@]}" "$remote" "python3 - '$stage'" <<'PY'
          import pathlib
          import re
          import shutil
          import sys

          path = pathlib.Path(sys.argv[1])
          if not re.fullmatch(
              r"/root/projects/copilot-api-release-staging/run-[0-9]+-[0-9]+",
              str(path),
          ) or path.resolve(strict=True) != path:
              raise RuntimeError("Refusing cleanup of an unexpected staging path")
          shutil.rmtree(path)
          PY
