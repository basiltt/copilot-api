name: Deploy to Server

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      preflight_only:
        description: Read-only production preflight without deployment or restarts
        type: boolean
        default: false

jobs:
  deploy:
    if: github.event_name != 'workflow_dispatch' || !inputs.preflight_only
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -euo pipefail
            export PATH=/root/.bun/bin:$PATH
            cd /root/projects/copilot-api

            # Hard-reset to the pushed commit rather than merging.
            #
            # `git pull` aborts when an untracked file on the server collides
            # with one arriving in the commit — which is exactly what happened
            # when deploy/token-watchdog.sh and deploy/copilot-api-watchdog.service
            # were created by hand on the box and later committed to the repo.
            # Because the old script ignored the failure, every subsequent run
            # rebuilt and restarted the *previous* code while still reporting
            # success, so the server silently sat on a stale commit.
            #
            # `set -e` above now makes any step failing abort the deploy, and
            # fetch + reset --hard is immune to untracked-file collisions.
            git fetch origin master
            git reset --hard origin/master
            # Drop leftover untracked files so the tree matches the commit
            # exactly, but keep node_modules/dist to avoid a cold rebuild.
            git clean -fd -e node_modules -e dist

            echo "Deploying $(git rev-parse --short HEAD)"

            bun install
            bun run build
            systemctl restart copilot-api
            sleep 3
            systemctl is-active copilot-api
            systemctl restart copilot-api-watchdog
            systemctl is-active copilot-api-watchdog

  preflight:
    if: github.event_name == 'workflow_dispatch' && inputs.preflight_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Read pinned-release state over verified SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$SERVER_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$SERVER_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          test -n "$SSHPASS"
          if ! command -v sshpass >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
          umask 077
          known_hosts="$RUNNER_TEMP/copilot-api-known-hosts"
          trap 'rm -f -- "$known_hosts"' EXIT
          ssh-keyscan -T 15 -t ed25519 "$SERVER_HOST" > "$known_hosts"
          fingerprint="$(ssh-keygen -l -E sha256 -f "$known_hosts" | awk '{print $2}')"
          test "$fingerprint" = "SHA256:B3uhmfjUir68hcntc1qDf1JOYTwVUALkD4+7c15VHCo"
          sshpass -e ssh -T \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" \
            -o ConnectTimeout=15 \
            -o PreferredAuthentications=password \
            -o NumberOfPasswordPrompts=1 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            "$SERVER_USER@$SERVER_HOST" 'python3 -' <<'PY'
          import datetime
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          if os.geteuid() != 0:
              raise RuntimeError("Production preflight requires the configured root identity")

          def command(*args):
              return subprocess.check_output(args, text=True).strip()

          def digest(path):
              return hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()

          units = {}
          for name in ("copilot-api", "copilot-api-watchdog", "nginx"):
              properties = command(
                  "systemctl", "show", name, "--no-pager",
                  "--property=ActiveState,SubState,MainPID,NRestarts",
              )
              unit = dict(line.split("=", 1) for line in properties.splitlines())
              unit["MainPID"] = int(unit["MainPID"])
              unit["NRestarts"] = int(unit["NRestarts"])
              if unit["ActiveState"] != "active" or unit["MainPID"] <= 0:
                  raise RuntimeError(f"{name} is not active")
              if name != "nginx":
                  cwd = pathlib.Path(f"/proc/{unit['MainPID']}/cwd").resolve(strict=True)
                  release = command("git", "-C", str(cwd), "rev-parse", "HEAD")
                  expected = pathlib.Path("/root/projects/copilot-api-releases") / release
                  if cwd != expected:
                      raise RuntimeError(f"{name} is not running from its pinned release")
                  unit["release"] = release
                  unit["tree"] = command("git", "-C", str(cwd), "rev-parse", "HEAD^{tree}")
                  unit["clean"] = not command("git", "-C", str(cwd), "status", "--porcelain")
              units[name] = unit

          environment_file = pathlib.Path("/root/projects/copilot-api/.env")
          metadata = environment_file.stat()
          process_environment = dict(
              entry.split(b"=", 1)
              for entry in pathlib.Path(
                  f"/proc/{units['copilot-api']['MainPID']}/environ"
              ).read_bytes().split(b"\0")
              if b"=" in entry
          )
          flags = {
              "WEB_SEARCH_PROVIDER": "copilot",
              "STRUCTURED_OUTPUT_RECOVERY": "1",
              "WRITE_TOOL_RECOVERY": "1",
              "TOOL_SEARCH_RECOVERY": "1",
              "COPILOT_NATIVE_MESSAGES": "1",
          }
          for name, expected in flags.items():
              if process_environment.get(name.encode()) != expected.encode():
                  raise RuntimeError(f"Required production flag is missing or different: {name}")
          result = {
              "checked_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "units": units,
              "environment": {
                  "sha256": digest(environment_file),
                  "uid": metadata.st_uid,
                  "gid": metadata.st_gid,
                  "mode": oct(metadata.st_mode & 0o777),
                  "flags": flags,
              },
              "pin_sha256": {
                  name: digest(
                      f"/etc/systemd/system/{name}.service.d/90-reviewed-release.conf"
                  )
                  for name in ("copilot-api", "copilot-api-watchdog")
              },
              "bun_version": command("/root/.bun/bin/bun", "--version"),
          }
          print(json.dumps(result, sort_keys=True))
          PY
