name: Deploy to Server

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      preflight_only:
        description: Read-only production preflight without deployment or restarts
        type: boolean
        default: false
      activate_reviewed_release:
        description: Activate reviewed 844d7a0 over baseline 4a04538, preserving proxy settings
        type: boolean
        default: false

jobs:
  deploy:
    if: github.event_name != 'workflow_dispatch' || (!inputs.preflight_only && !inputs.activate_reviewed_release)
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -euo pipefail
            export PATH=/root/.bun/bin:$PATH
            cd /root/projects/copilot-api

            # Hard-reset to the pushed commit rather than merging.
            #
            # `git pull` aborts when an untracked file on the server collides
            # with one arriving in the commit — which is exactly what happened
            # when deploy/token-watchdog.sh and deploy/copilot-api-watchdog.service
            # were created by hand on the box and later committed to the repo.
            # Because the old script ignored the failure, every subsequent run
            # rebuilt and restarted the *previous* code while still reporting
            # success, so the server silently sat on a stale commit.
            #
            # `set -e` above now makes any step failing abort the deploy, and
            # fetch + reset --hard is immune to untracked-file collisions.
            git fetch origin master
            git reset --hard origin/master
            # Drop leftover untracked files so the tree matches the commit
            # exactly, but keep node_modules/dist to avoid a cold rebuild.
            git clean -fd -e node_modules -e dist

            echo "Deploying $(git rev-parse --short HEAD)"

            bun install
            bun run build
            systemctl restart copilot-api
            sleep 3
            systemctl is-active copilot-api
            systemctl restart copilot-api-watchdog
            systemctl is-active copilot-api-watchdog

  preflight:
    if: github.event_name == 'workflow_dispatch' && (inputs.preflight_only || inputs.activate_reviewed_release)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Read pinned-release state over verified SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$SERVER_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$SERVER_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          test -n "$SSHPASS"
          if ! command -v sshpass >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
          umask 077
          known_hosts="$RUNNER_TEMP/copilot-api-known-hosts"
          trap 'rm -f -- "$known_hosts"' EXIT
          ssh-keyscan -T 15 -t ed25519 "$SERVER_HOST" > "$known_hosts"
          fingerprint="$(ssh-keygen -l -E sha256 -f "$known_hosts" | awk '{print $2}')"
          test "$fingerprint" = "SHA256:B3uhmfjUir68hcntc1qDf1JOYTwVUALkD4+7c15VHCo"
          sshpass -e ssh -T \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" \
            -o ConnectTimeout=15 \
            -o PreferredAuthentications=password \
            -o NumberOfPasswordPrompts=1 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            "$SERVER_USER@$SERVER_HOST" 'python3 -' <<'PY'
          import datetime
          import collections
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess

          if os.geteuid() != 0:
              raise RuntimeError("Production preflight requires the configured root identity")

          def command(*args):
              return subprocess.check_output(args, text=True).strip()

          def digest(path):
              return hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()

          def routing_diagnostics(main_pid):
              if type(main_pid) is not int or main_pid <= 0:
                  raise RuntimeError("Invalid main process for routing diagnostics")
              reasons = {
                  "assistant_block_unsupported", "container", "context_management",
                  "effort_unsupported", "max_tokens_invalid", "mcp_servers",
                  "message_content_invalid", "message_nonobject", "message_role_absent",
                  "message_role_developer", "message_role_other", "message_role_system",
                  "message_role_system_nonprefix", "message_role_tool", "output_format",
                  "redacted_thinking_invalid", "system_block_unsupported", "thinking_invalid",
                  "thinking_signature_missing", "tool_result_content_missing",
                  "tool_result_content_unsupported", "tool_schema_root_composition",
                  "tool_use_invalid", "typed_tools",
                  "user_block_unsupported",
              }
              result = subprocess.run(
                  ["journalctl", "--unit=copilot-api", "--since=-24h", "--lines=5000",
                   "--no-pager", "--output=cat", f"_PID={main_pid}"],
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=20,
              )
              if result.returncode != 0:
                  raise RuntimeError("Could not read bounded routing diagnostics")
              log = result.stdout[-8 * 1024 * 1024:].decode(errors="replace")
              counts = collections.Counter()
              routing = collections.Counter()
              buffered_kinds = collections.Counter()
              buffered_reasons = collections.Counter()
              recovery_outcomes = collections.Counter()
              recovery_reasons = collections.Counter()
              outcome_names = {
                  "canceled", "policy_or_transport", "schema_invalid",
                  "shape_rejected", "timed_out", "validated",
              }
              recovery_reason_names = {
                  "choice_count", "finish_reason", "additional_output", "refusal",
                  "no_calls", "tool_identity", "missing_id", "duplicate_id",
                  "call_count", "model_identity", "signed_thinking", "arguments_changed",
              }
              buffered_kind_names = {"protocol", "transport", "upstream_http", "timeout", "unexpected"}
              buffered_reason_names = {
                  "initial_generation_deadline", "timeout", "aborted", "connection_reset",
                  "connection_refused", "connection_closed", "connection_failed", "dns_error",
                  "unclassified_error", "http_error", "non_error", "failure",
              }
              for block in re.findall(r"Buffered Anthropic stream failed\s*\{([^}]{0,512})\}", log):
                  kind = re.search(r"kind['\"]?\s*:\s*['\"]([a-z_]+)['\"]", block)
                  reason = re.search(r"reason['\"]?\s*:\s*['\"]([a-z_]+)['\"]", block)
                  if kind and kind[1] in buffered_kind_names:
                      buffered_kinds[kind[1]] += 1
                  if reason and reason[1] in buffered_reason_names:
                      buffered_reasons[reason[1]] += 1
              for block in re.findall(r"ToolSearch argument regeneration outcome\s*\{([^}]{0,512})\}", log):
                  outcome = re.search(r"outcome['\"]?\s*:\s*['\"]([a-z_]+)['\"]", block)
                  reason = re.search(r"reason['\"]?\s*:\s*['\"]([a-z_]+)['\"]", block)
                  if outcome and outcome[1] in outcome_names:
                      recovery_outcomes[outcome[1]] += 1
                  if reason and reason[1] in recovery_reason_names:
                      recovery_reasons[reason[1]] += 1
              for choice in re.findall(r"nativeRouting['\"]?\s*:\s*['\"]([a-z_]+)['\"]", log):
                  if choice in {"native_disabled", "model_not_advertised", "request_unsupported"}:
                      routing[choice] += 1
              for block in re.findall(r"nativeRejectionReasons['\"]?\s*:\s*\[([^\]]{0,2048})\]", log):
                  for reason in re.findall(r"['\"]([a-z_]+)['\"]", block):
                      if reason in reasons:
                          counts[reason] += 1
              return {
                  "scope": "current main process; last 5000 journal entries within 24 hours; latest 8 MiB inspected",
                  "agent_constraints_skipped": log.count("Agent schema constraints not applied"),
                  "native_routing_counts": dict(sorted(routing.items())),
                  "native_rejection_counts": dict(sorted(counts.items())),
                  "buffered_protocol_failures": log.count("Buffered Chat stream protocol failure"),
                  "buffered_stream_failures": log.count("Buffered Anthropic stream failed"),
                  "buffered_stream_failure_kinds": dict(sorted(buffered_kinds.items())),
                  "buffered_stream_failure_reasons": dict(sorted(buffered_reasons.items())),
                  "native_malformed_tool_inputs": log.count("Native Messages completed with malformed tool input"),
                  "tool_schema_rejections": log.count("arguments do not match the declared input_schema"),
                  "toolsearch_regeneration_outcomes": dict(sorted(recovery_outcomes.items())),
                  "toolsearch_regeneration_rejection_reasons": dict(sorted(recovery_reasons.items())),
                  "native_root_schema_rejections": log.count("input_schema does not support oneOf, allOf, or anyOf at the top level"),
                  "unsigned_thinking_rejections": log.count("thinking_signature_missing"),
                  "raw_request_debug_entries_present": "Anthropic request payload:" in log,
                  "request_or_tool_content_returned": False,
              }

          units = {}
          for name in ("copilot-api", "copilot-api-watchdog", "nginx"):
              properties = command(
                  "systemctl", "show", name, "--no-pager",
                  "--property=ActiveState,SubState,MainPID,NRestarts",
              )
              unit = dict(line.split("=", 1) for line in properties.splitlines())
              unit["MainPID"] = int(unit["MainPID"])
              unit["NRestarts"] = int(unit["NRestarts"])
              if unit["ActiveState"] != "active" or unit["MainPID"] <= 0:
                  raise RuntimeError(f"{name} is not active")
              if name != "nginx":
                  cwd = pathlib.Path(f"/proc/{unit['MainPID']}/cwd").resolve(strict=True)
                  arguments = pathlib.Path(
                      f"/proc/{unit['MainPID']}/cmdline"
                  ).read_bytes().decode().replace("\0", " ")
                  pattern = r"/root/projects/copilot-api-releases/([0-9a-f]{40})(?:/|\b)"
                  releases = set(re.findall(pattern, str(cwd) + "\n" + arguments))
                  if len(releases) != 1:
                      raise RuntimeError(f"{name} has no unique running release identity")
                  release = releases.pop()
                  expected = pathlib.Path("/root/projects/copilot-api-releases") / release
                  if command("git", "-C", str(expected), "rev-parse", "HEAD") != release:
                      raise RuntimeError(f"{name} release directory does not match its commit")
                  configured = command(
                      "systemctl", "show", name, "--no-pager",
                      "--property=ExecStart,WorkingDirectory",
                  )
                  pin = pathlib.Path(
                      f"/etc/systemd/system/{name}.service.d/90-reviewed-release.conf"
                  ).read_text()
                  unit["release"] = release
                  unit["cwd_matches_release"] = cwd == expected
                  unit["configured_release_matches"] = set(re.findall(pattern, configured)) == {release}
                  unit["pin_matches_release"] = set(re.findall(pattern, pin)) == {release}
                  unit["tree"] = command("git", "-C", str(expected), "rev-parse", "HEAD^{tree}")
                  unit["clean"] = not command("git", "-C", str(expected), "status", "--porcelain")
              units[name] = unit

          environment_file = pathlib.Path("/root/projects/copilot-api/.env")
          metadata = environment_file.stat()
          process_environment = dict(
              entry.split(b"=", 1)
              for entry in pathlib.Path(
                  f"/proc/{units['copilot-api']['MainPID']}/environ"
              ).read_bytes().split(b"\0")
              if b"=" in entry
          )
          flags = {
              "WEB_SEARCH_PROVIDER": "copilot",
              "STRUCTURED_OUTPUT_RECOVERY": "1",
              "WRITE_TOOL_RECOVERY": "1",
              "TOOL_SEARCH_RECOVERY": "1",
              "COPILOT_NATIVE_MESSAGES": "1",
          }
          for name, expected in flags.items():
              if process_environment.get(name.encode()) != expected.encode():
                  raise RuntimeError(f"Required production flag is missing or different: {name}")
          agent_constraints = process_environment.get(b"AGENT_SCHEMA_CONSTRAINTS")
          if agent_constraints not in (None, b"0", b"1"):
              raise RuntimeError("The Agent constraints process setting is invalid")
          flags["AGENT_SCHEMA_CONSTRAINTS"] = (
              agent_constraints.decode() if agent_constraints is not None else None
          )
          result = {
              "checked_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "units": units,
              "environment": {
                  "sha256": digest(environment_file),
                  "uid": metadata.st_uid,
                  "gid": metadata.st_gid,
                  "mode": oct(metadata.st_mode & 0o777),
                  "flags": flags,
              },
              "pin_sha256": {
                  name: digest(
                      f"/etc/systemd/system/{name}.service.d/90-reviewed-release.conf"
                  )
                  for name in ("copilot-api", "copilot-api-watchdog")
              },
              "bun_version": command("/root/.bun/bin/bun", "--version"),
              "routing_diagnostics": routing_diagnostics(units["copilot-api"]["MainPID"]),
          }
          print(json.dumps(result, sort_keys=True))
          PY

  reviewed_release:
    if: github.event_name == 'workflow_dispatch' && inputs.activate_reviewed_release && !inputs.preflight_only
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: copilot-api-reviewed-release
      cancel-in-progress: false
    steps:
      - name: Check out deployment controls
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Transfer and activate the verified isolated release
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          APPLICATION_SHA: 844d7a07f6c63b693ec599219e7157e1d21d58b0
          APPLICATION_TREE: ad52dd0b9b33c64f7a995aeb2d3206917822c731
          EXPECTED_LIVE_SHA: 4a04538dc3dfe8287c206e4698c4e51be0b3eb70
        run: |
          set -euo pipefail
          [[ "$SERVER_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$SERVER_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          test -n "$SSHPASS"
          test "$(git rev-parse "$APPLICATION_SHA^{tree}")" = "$APPLICATION_TREE"
          git merge-base --is-ancestor "$EXPECTED_LIVE_SHA" "$APPLICATION_SHA"
          git merge-base --is-ancestor "$APPLICATION_SHA" HEAD
          git update-ref refs/heads/task-reviewed-release "$APPLICATION_SHA"
          git bundle create "$RUNNER_TEMP/release.bundle" refs/heads/task-reviewed-release
          git bundle verify "$RUNNER_TEMP/release.bundle"
          bundle_hash="$(sha256sum "$RUNNER_TEMP/release.bundle" | cut -d ' ' -f 1)"
          if ! command -v sshpass >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
          umask 077
          known_hosts="$RUNNER_TEMP/copilot-api-known-hosts"
          trap 'rm -f -- "$known_hosts" "$RUNNER_TEMP/release.bundle"' EXIT
          ssh-keyscan -T 15 -t ed25519 "$SERVER_HOST" > "$known_hosts"
          fingerprint="$(ssh-keygen -l -E sha256 -f "$known_hosts" | awk '{print $2}')"
          test "$fingerprint" = "SHA256:B3uhmfjUir68hcntc1qDf1JOYTwVUALkD4+7c15VHCo"
          options=(
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts"
            -o ConnectTimeout=15
            -o PreferredAuthentications=password
            -o NumberOfPasswordPrompts=1
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=2
          )
          remote="$SERVER_USER@$SERVER_HOST"
          stage="/root/projects/copilot-api-release-staging/run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          sshpass -e ssh -T "${options[@]}" "$remote" \
            "umask 077; test ! -e '$stage' && mkdir -p -m 700 '$stage'"
          sshpass -e scp "${options[@]}" \
            "$RUNNER_TEMP/release.bundle" deploy/activate-reviewed-release.sh "$remote:$stage/"
          sshpass -e ssh -T "${options[@]}" "$remote" \
            "bash '$stage/activate-reviewed-release.sh' '$APPLICATION_SHA' '$EXPECTED_LIVE_SHA' '$bundle_hash' '$APPLICATION_TREE'"
          sshpass -e ssh -T "${options[@]}" "$remote" "python3 - '$stage'" <<'PY'
          import pathlib
          import re
          import shutil
          import sys

          path = pathlib.Path(sys.argv[1])
          if not re.fullmatch(
              r"/root/projects/copilot-api-release-staging/run-[0-9]+-[0-9]+",
              str(path),
          ) or path.resolve(strict=True) != path:
              raise RuntimeError("Refusing cleanup of an unexpected staging path")
          shutil.rmtree(path)
          PY
